{% include 'user_navigation.html' %}


<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
    Take Item
</marquee>
<hr>
<form class="container mt-5" onsubmit="return checkpass();" name="signup" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>Your Name</label>
            <input type="text" class="form-control" value="{{user.first_name}} {{user.last_name}}" name="fname" readonly>
        </div>

        <div class="form-group col-md-6" >
            <label>Item Name</label>
            <input type="text" class="form-control" value="{{data.title}}" name="lname" readonly>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-7" >
            <label>Contact Number:</label>
            <input type="text" class="form-control" name="contact" placeholder="Enter Phone Number" required>
        </div>
        <div class="form-group col-md-5" >
            <label>Item Image:</label>
            <img src="{{data.image.url}}" height="100" width="300" alt="" style="border-radius:30px;">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>Email ID:</label>
            <input type="text" class="form-control" value="{{user.username}}" name="email" readonly>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>Address:</label>
            <input type="text" class="form-control" name="exp" placeholder="Enter Your Address" >
        </div>

        <div class="form-group col-md-6" >
            <label>State:</label>
            <input type="text" class="form-control" name="que" placeholder="Enter Your State" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>Gender</label>
            <div style="border:1px solid lightgrey ; padding:6px ; border-radius:6px">
            <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" id="customRadioInLine1" name="gender" class="custom-control-input" value="Male">
                <label class="custom-control-label" for="customRadioInLine1">Male</label>
            </div>
            <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" id="customRadioInLine2" name="gender" class="custom-control-input" value="Female">
                <label class="custom-control-label" for="customRadioInLine2">Female</label>
            </div>
                </div>
        </div>

        <div class="form-group col-md-6" >
            <label>Profile Picture:</label>
            <input type="file" class="form-control" name="image" required>
        </div>
    </div>
<center>
    <input type="submit" value="Take Item" class="btn btn-primary my-3" style="width:200px">
</center>
</form>


{% if error == "no" %}
<script>
    alert("Accepted Item Successfully")
    window.location = ('{% url 'view_job_user' %}')
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Somthing Wrong, Try Again...")
</script>
{% endif %}

{% include 'footer.html' %}

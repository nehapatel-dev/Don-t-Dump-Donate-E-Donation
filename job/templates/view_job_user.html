{% include 'user_navigation.html' %}
<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
        All Items
</marquee>
<hr>
<div class="container mt-4">

    <div class="row">
    {% for i in data %}

    <div class="card float col-3 mt-3 mb-2 " style="width:300px">
        <h3><font face="mv boli" size="5">Item Name: {{i.title}}</font></h3>
        <img class="card-img-top" src="{{i.image.url}}" alt="Card image" height="200px">
        <div class="card-body">
          <h4 class="card-title">{{i.type}}</h4>
          <h5 class="card-title">{{i.start_date}} /Day</h5>

            <div class="row">
                <div class="form-group col-md-12" >
                    <p class="card-text">{{i.end_date}}</p>
                </div>
            </div>
<!--            <div class="row">-->
<!--                <div class="form-group col-md-12" >-->
<!--                    <p class="card-text">Accepted By:-</p>-->
<!--                </div>-->
<!--            </div>-->
      {% if i.location == "Pending" %}
            <a href="{% url 'apply_now' i.id %}" class="btn btn-primary">Take This</a>
      {% endif %}
        </div>
    </div>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
{% endfor %}
    </div>
</div>

{% load static %}

{% block body %}

{% include 'navigation.html' %}

<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
    Admin Login
</marquee>
<hr>
<form class="container mt-5" method="post">
    {% csrf_token %}
    <label><b>Username:</b></label>
    <input type="text" class="form-control" name="uname" placeholder="Enter Username" required>
    <label><b>Password:</b></label>
    <input type="password" class="form-control" name="pwd" placeholder="Enter Password" required
    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=]).{8,}" title="Must contain at least one number, one uppercase, one lowercase, one special character and at least 8 characters long">
<center>
    <input type="submit" class="btn btn-primary" value="Login" style="margin-top:2%; color:darkcyan; background-color:black ;width:200px; height:50px; font-size:25px">
</center>
</form>
<script>
function validateAdminLogin() {
    const password = document.getElementById("pwd").value;


    const passRegex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=]).{8,}$/;
    if (!passRegex.test(password)) {
        alert("Password must contain at least:\n- 8 characters\n- One uppercase letter\n- One lowercase letter\n- One number\n- One special character (@#$%^&+=)");
        return false;
    }

    return true;
}
</script>


{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Login Successfully")
    window.location = "{% url 'admin_home' %}"
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Invalid Login Details, Try Agail.....")
</script>
{% endif %}
{% endblock %}

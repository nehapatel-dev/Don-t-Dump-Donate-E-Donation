{% load static %}

{% block body %}

{% include 'navigation.html' %}

<script>
    function checkpass()
    {
    if(document.signup.pwd.value!=document.signup.cpwd.value)
     {
     alert('Password Does Not Match')
     document.signup.cpwd.focus();
     return false;
     }
     return true;
    }
</script>

<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:lightgreen; background-color:black; font-weight:bold; margin-top:1%">
    Donor Signup
</marquee>
<hr>
<form class="container mt-5" onsubmit="return checkpass();" name="signup" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>First Name</label>
            <input type="text" class="form-control" name="fname" placeholder="Enter First Name" required
             onkeypress="return onlyAlphabets(event)" title="Only alphabets allowed">

        </div>

        <div class="form-group col-md-6" >
            <label>Last Name</label>
            <input type="text" class="form-control" name="lname" placeholder="Enter Last Name" required
            onkeypress="return onlyAlphabets(event)" title="Only alphabets allowed">
        </div>
        </div>
    

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>Contact Number:</label>
            <input type="text" class="form-control" name="contact" placeholder="Enter Phone Number" required
            onkeypress="return onlyNumbers(event)" maxlength="10" title="Only digits allowed">
        </div>

        <div class="form-group col-md-6" >
            <label>Item Type:</label>
            <input type="text" class="form-control" name="company" placeholder="Which type of Item Your want to donate."
             required onkeypress="return onlyAlphabets(event)" title="Only alphabets allowed">
        </div>
    </div>


    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>Email ID:</label>
            <input type="email" class="form-control" name="email" placeholder="Enter Email Address" required
            title="Enter a valid email address (e.g. someone@example.com)">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>Password:</label>
            <input type="password" class="form-control" name="pwd" placeholder="Enter Password" required
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=]).{8,}"
 title="Must contain at least one number, one uppercase, one lowercase, one special character and at least 8 characters long">
        </div>

        <div class="form-group col-md-6" >
            <label>Confirm Password:</label>
            <input type="password" class="form-control" name="cpwd" placeholder="Confirm Password" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6" >
            <label>Gender</label>
            <div style="border:1px solid lightgrey ; padding:6px ; border-radius:6px">
            <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" id="customRadioInLine1" name="gender" class="custom-control-input" value="Male">
                <label class="custom-control-label" for="customRadioInLine1">Male</label>
            </div>
            <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" id="customRadioInLine2" name="gender" class="custom-control-input" value="Female">
                <label class="custom-control-label" for="customRadioInLine2">Female</label>
            </div>
                </div>
        </div>

        <div class="form-group col-md-6" >
            <label>Image</label>
            <input type="file" class="form-control" name="image" required>
        </div>
    </div>
<center>
    <input type="submit" value="Submit" class="btn btn-primary my-3" style="width:200px">
</center>
</form>
<script>
function onlyAlphabets(e) {
  var charCode = e.which || e.keyCode;
  if ((charCode >= 65 && charCode <= 90) || 
      (charCode >= 97 && charCode <= 122) || 
      charCode === 32) { 
    return true;
  }
  return false;
}
function onlyNumbers(e) {
  var charCode = e.which || e.keyCode;
  if (charCode >= 48 && charCode <= 57) {
    return true;
  }
  return false;
}
function validatePasswords() {
    const pwd = document.getElementById("password").value;
    const confirmPwd = document.getElementById("confirm_password").value;

    if (pwd !== confirmPwd) {
      alert("Passwords do not match!");
      return false; 
    }
    return true; 
  }

</script>



{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Signup Successfull")
    window.location = "{% url 'recuiter_login' %}"
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Somthing Wrong, Try Again...")
</script>
{% endif %}
{% endblock %}
